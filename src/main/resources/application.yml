server:
  port: 8080

spring:
  application:
    name: NetSentinel-AI
  threads:
    virtual:
      enabled: true

# NetSentinel Configuration
netsentinel:
  scan:
    mode: simulated          # simulated | live
    thread-pool-size: 100    # Virtual thread concurrency limit
    timeout-ms: 5000         # Per-host scan timeout
    simulated-delay-ms: 200  # Artificial delay per host in simulation
  ai:
    model-retrain: false     # Re-train DL4J model on startup
    k-paths: 5               # Number of attack paths to compute
  graph:
    max-nodes: 500           # Maximum nodes in attack graph

logging:
  level:
    com.netsentinel: DEBUG
    org.deeplearning4j: WARN
    org.nd4j: WARN
